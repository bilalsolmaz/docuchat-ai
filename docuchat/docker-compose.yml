version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuchat-backend
    ports:
      - "8001:8000"
    volumes:
      - ./uploads_vol:/app/uploads      # Yüklenen dosyalar kalıcı saklanır
      - ./chroma_vol:/app/chroma_db     # Vektör DB kalıcı saklanır
      - ./frontend:/frontend            # Frontend statik dosyaları
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

# Not: Frontend dosyaları backend container'ı tarafından /static rotasında sunulur.
# Ayrı bir nginx container'a gerek yoktur.
